<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TACMAP / ATAK Web with Compass</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #00ff66; }
    #map { width: 100vw; height: 100vh; z-index: 1; }

    .control-panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(18, 18, 18, 0.85); border: 1px solid #00ff66; padding: 12px; border-radius: 6px; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); backdrop-filter: blur(5px); max-width: 300px; width: calc(100% - 20px); }
    .control-panel h3 { font-size: 14px; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #00ff66; padding-bottom: 4px; }
    .field-group { margin-bottom: 8px; }
    label { display: block; font-size: 10px; color: #aaa; margin-bottom: 2px; text-transform: uppercase; }
    input[type="text"] { width: 100%; background: #000; border: 1px solid #00ff66; color: #00ff66; padding: 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    
    button { width: 100%; background: #00ff66; color: #000; border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; margin-top: 4px; transition: background 0.2s; }
    button:hover { background: #00cc55; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    button.active { background: #ff3333; color: white; }
    button.active:hover { background: #cc2222; }

    .status-box { font-size: 11px; margin-top: 8px; padding: 4px; background: rgba(0, 0, 0, 0.5); border-left: 3px solid #ffcc00; word-break: break-all; }

    /* --- NOWE STYLE DLA STRZAŁKI --- */
    .operator-marker-container {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .compass-arrow {
      width: 0;
      height: 0;
      /* Tworzymy trójkąt/strzałkę za pomocą borders */
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 25px solid #00ff66; /* Kolor strzałki */
      
      /* Efekt poświaty */
      filter: drop-shadow(0 0 5px #00ff66);
      
      /* Zapewniamy płynny obrót */
      transition: transform 0.1s linear; 
      
      /* Punkt obrotu na środku podstawy trójkąta, 
         ale musimy go przesunąć, żeby obracał się wokół "środka ciężkości" operatora */
      transform-origin: center 70%; 
    }

    /* Kropka oznaczająca dokładną pozycję na środku strzałki */
    .position-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border: 2px solid #000;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .operator-label {
      position: absolute;
      top: 30px; /* Poniżej strzałki */
      background: rgba(0, 0, 0, 0.8);
      color: #00ff66;
      border: 1px solid #00ff66;
      font-family: monospace;
      font-size: 10px;
      padding: 1px 4px;
      white-space: nowrap;
      border-radius: 2px;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h3>SYSTEM TAKTYCZNY C2</h3>
    <div class="field-group">
      <label for="callsign">Kryptonim (Callsign)</label>
      <input type="text" id="callsign" placeholder="np. ALPHA-1" maxlength="12">
    </div>
    <!-- Zmieniony przycisk, obsłuży też iOS permissions -->
    <button id="btnStart" onclick="requestPermissionsAndStart()">Uruchom System (GPS + Kompas)</button>
    <button id="btnStop" onclick="stopSystem()" style="display:none;" class="active">Zatrzymaj</button>
    <div id="status" class="status-box">Status: Gotowy (Wymaga HTTPS dla kompasu)</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // TWOJA KONFIGURACJA FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCW3iyh5jjYVif00FPqztEFCKqJTg1LD4Q",
      authDomain: "tac-dashboard-3f4e5.firebaseapp.com",
      databaseURL: "https://tac-dashboard-3f4e5-default-rtdb.firebaseio.com",
      projectId: "tac-dashboard-3f4e5",
      storageBucket: "tac-dashboard-3f4e5.firebasestorage.app",
      messagingSenderId: "44394153053",
      appId: "1:44394153053:web:2c39f817a6ecf8498b79b4",
      measurementId: "G-8YWKXBX5LF"
    };

    // Inicjalizacja Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

// Inicjalizacja Mapy
    const map = L.map('map', { zoomControl: false }).setView([50.2599, 19.0216], 13);

    // Zdjęcia satelitarne Esri (darmowe, bez klucza API)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Zmienne stanowe
    let watchId = null;
    let myCallsign = "";
    let currentHeading = 0; // Kompas
    const operatorsMarkers = {};

    const callsignInput = document.getElementById('callsign');
    const statusDiv = document.getElementById('status');

    // --- NOWA FUNKCJA TWORZĄCA IKONĘ STRZAŁKI ---
    function createOperatorIcon(callsign, heading) {
      // heading to stopnie 0-360
      return L.divIcon({
        className: 'operator-marker-div', // Leaflet wymaga klasy, ale customizujemy w html
        html: `
          <div class="operator-marker-container">
            <!-- Tutaj aplikujemy obrót CSS bezpośrednio na strzałkę -->
            <div class="compass-arrow" style="transform: rotate(${heading}deg);"></div>
            <div class="position-dot"></div>
            <div class="operator-label">${callsign}</div>
          </div>
        `,
        iconSize: [30, 42], // Rozmiar kontenera
        iconAnchor: [15, 30] // Punkt kotwiczenia (środek kropki)
      });
    }

    // --- FUNKCJA STARTUJĄCA CAŁY SYSTEM (Wywoływana z HTML) ---
    window.requestPermissionsAndStart = async function() {
      myCallsign = callsignInput.value.trim().toUpperCase();
      if (!myCallsign) { alert("Wprowadź kryptonim!"); return; }

      statusDiv.textContent = "Status: Prośba o uprawnienia...";

      // 1. Obsługa Kompasu (Orientation)
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ wymaga jawnej zgody po kliknięciu
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            startCompassListing();
          } else {
            statusDiv.textContent = "Błąd: Brak zgody na kompas.";
          }
        } catch (error) {
          console.error(error);
          statusDiv.textContent = "Błąd kompasu (iOS).";
        }
      } else {
        // Inne urządzenia (Android/PC) - HTTPS wymagane
        if ('deviceorientationabsolute' in window) {
           window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else if ('deviceorientation' in window) {
           window.addEventListener('deviceorientation', handleOrientation, true);
        } else {
           statusDiv.textContent = "Błąd: Kompas niedostępny w tej przeglądarce.";
        }
      }

      // 2. Start GPS
      startGps();

      // UI update
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      callsignInput.disabled = true;
    }

    // Pomocnicza dla iOS
    function startCompassListing() {
      if ('deviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    // --- OBSŁUGA DANYCH Z KOMPASU ---
    function handleOrientation(event) {
      // deviceorientationabsolute daje kierunek względem północy magnetycznej
      let heading = null;

      if (event.webkitCompassHeading) {
        // iOS
        heading = event.webkitCompassHeading;
      } else if (event.absolute === true && event.alpha !== null) {
        // Android / Chrome - alpha to obrót wokół osi Z
        // Musimy to przeliczyć, bo alpha rośnie przeciwnie do ruchu wskazówek zegara
        heading = 360 - event.alpha;
      }

      if (heading !== null) {
        currentHeading = Math.round(heading);
        // Opcjonalnie: aktualizuj bazę częściej przy obrocie (ale to generuje ruch)
        // updateMyPositionInFirebase(); // Zbyt częste! Lepiej czekać na GPS update.
      }
    }

    // --- OBSŁUGA GPS (Zaktualizowana o Heading) ---
    function startGps() {
      if (!("geolocation" in navigator)) { alert("Brak GPS."); return; }

      const myRef = ref(db, `operators/${myCallsign}`);
      onDisconnect(myRef).remove();

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          updateFirebaseWithFullData(position.coords);
        },
        (error) => {
          statusDiv.textContent = `Błąd GPS: ${error.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    // Wysyłamy GPS + ostatni znany Heading z kompasu
    function updateFirebaseWithFullData(coords) {
      const data = {
        lat: coords.latitude,
        lng: coords.longitude,
        // Używamy heading z GPS jeśli jedziemy, lub z kompasu jeśli stoimy
        // Coords.heading jest dostępne tylko gdy się poruszamy (speed > 0)
        heading: coords.heading || currentHeading || 0, 
        speed: coords.speed || 0,
        accuracy: coords.accuracy || 0,
        timestamp: Date.now()
      };

      set(ref(db, `operators/${myCallsign}`), data);
      statusDiv.textContent = `Status: OK | Dokładność: ${Math.round(coords.accuracy)}m | Kierunek: ${currentHeading}°`;
    }

    window.stopSystem = function() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
      window.removeEventListener('deviceorientation', handleOrientation, true);

      if (myCallsign) set(ref(db, `operators/${myCallsign}`), null);

      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
      callsignInput.disabled = false;
      statusDiv.textContent = "Status: Zatrzymany.";
    }

    // --- NASŁUCHIWANIE MAPY (Zaktualizowane o obrót ikony) ---
    const operatorsRef = ref(db, 'operators');
    onValue(operatorsRef, (snapshot) => {
      const activeOperators = snapshot.val() || {};

      // Usuń nieaktywnych
      Object.keys(operatorsMarkers).forEach((callsign) => {
        if (!activeOperators[callsign]) {
          map.removeLayer(operatorsMarkers[callsign]);
          delete operatorsMarkers[callsign];
        }
      });

      // Aktualizuj/Dodaj
      Object.keys(activeOperators).forEach((callsign) => {
        const op = activeOperators[callsign];
        const pos = [op.lat, op.lng];

        if (operatorsMarkers[callsign]) {
          // 1. Zaktualizuj pozycję
          operatorsMarkers[callsign].setLatLng(pos);
          
          // 2. Zaktualizuj ikonę (obrót strzałki) - musimy podmienić całą ikonę
          operatorsMarkers[callsign].setIcon(createOperatorIcon(callsign, op.heading));
        } else {
          // Stwórz nowy marker ze strzałką ustawioną na op.heading
          const marker = L.marker(pos, {
            icon: createOperatorIcon(callsign, op.heading)
          }).addTo(map);

          marker.bindPopup(`<b>${callsign}</b><br>Prędkość: ${(op.speed * 3.6).toFixed(1)} km/h`);
          operatorsMarkers[callsign] = marker;

          if (callsign === myCallsign) map.setView(pos, 16);
        }
      });
    });
  </script>
</body>
</html>
